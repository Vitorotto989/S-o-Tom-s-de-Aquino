<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>São Tomás de Aquino</title>
<style>
    header{
        background-color:#142222;
        color:#ff0000;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        boder: 5px solid
        rgb(204, 152, 152);
    }
    article{
        display: flex;

    }
    img{
        width:320px;
        height:320px;
        .artigo-autor{
         font-weight: bold;   
        }
    }
    p{
        font-weight: bold;
    }
    main {
        background-color:#ff0000;
        color:#142222;
    }
    </style>
    </head>
<body>
   <header>
    <h1>Tomás de Aquino</h1>
    <p>Um grande filósofo e um frade italiano
  </header>

  <main>
    <article>

        <img src="Tomás.png" alt"A imagem é uma ilustração em estilo pixel art que retrata São Tomás de Aquino lecionando para um grupo de estudantes em um ambiente medieval, possivelmente uma sala de aula de um mosteiro ou universidade antiga."
     
        <div>
            <h2>Descubra os grandes feitos de Tomás de Aquino</h2>
            <p class="artigo.autor">Por Vitor</p>
            <button> ❤ <span>0</span></button>
            <button> 👍 <span>0</span></button>
        </div>
    </article>
     </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao){
        botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
          console.log("fui clicado");
          let texto = botao.querySelector("span");
          texto. textContent++;
        }
    }

    )


</script>
</html>
